<script type="application/ld+json">{"mainEntity":[{"name":"Is car insurance compulsory?","acceptedAnswer":{"text":"<p>Yes, you are legally obliged to take out <a href=\"third-party-liability-car-insurance\">civil liability</a>&nbsp;(third party) insurance. If you cause an accident, your insurance will pay for the damage you cause to others, but not for the damage to your own car.</p>","@type":"Answer"},"@type":"Question"},{"name":"How can I apply for ING Car Insurance?","acceptedAnswer":{"text":"<p>Calculate your car insurance rate on <a href=\"individuals\">www.ing.be</a>, via Home'Bank or the ING Banking app. Interested? Apply and sign your contract online. You still have questions? Our staff will happily guide you. Call +32 2 464 65 01 (Monday to Friday 8 a.m. to 6 p.m.) or&nbsp;<a href=\"branches_1\">go to your branch</a>.</p>","@type":"Answer"},"@type":"Question"},{"name":"I’m already insured elsewhere. How should I proceed ?","acceptedAnswer":{"text":"<p>Apply for your ING Car Insurance straight away and indicate in your request that you want ING to take care of your transfer!</p><p>Since 1 October 2024, a new law applies to contracts started or renewed after that date. You can find more information <a href=\"changing-insurer\">here</a>.&nbsp;</p>","@type":"Answer"},"@type":"Question"},{"name":"Who can take out ING Car Insurance?","acceptedAnswer":{"text":"<ul><li>Private persons at least 18 years old</li><li>And a legal address in Belgium</li><li>With a car to be insured that’s registered in Belgium.</li></ul>","@type":"Answer"},"@type":"Question"},{"name":"Can I also take out car insurance for an used car?","acceptedAnswer":{"text":"<p>Yes, of course! <a href=\"https://www.ing.be/en/individuals/my-life/mobility/buying-first-car\">Your&nbsp;first car</a>&nbsp;is maybe a a second hand car. Your premium will be determined on the invoice value or the current market value of your vehicle. When you switch insurance, your premium is often lower. You enter the invoice value of your vehicle yourself. If you no longer have the invoice, our simulator will estimate the market value of your vehicle based on the data you entered.</p>","@type":"Answer"},"@type":"Question"},{"name":"How can I adapt my car insurance?","acceptedAnswer":{"text":"<p>At ING, you can easily manage your insurance policy yourself.</p><ul><li>Open your ING Banking app or log on to&nbsp;Home’Bank and select your insurance in <a href=\"https://ebanking.ing.be/banking/overview\">the Overview</a>. Then go to&nbsp;'Change your contract' at the top of the contract page.</li><li>You can also call the ING Assist'line on <a href=\"tel:+32 2 725 15 00\">+32 2 725 15 00</a>.</li></ul><p>You will always receive a written confirmation at your legal address or on your email address.</p>","@type":"Answer"},"@type":"Question"},{"name":"Can I pay for my car insurance in instalments?","acceptedAnswer":{"text":"<p>Yes, it’s possible. If you can’t pay your insurance in one go, you can opt for monthly payments via direct debit. There are no extra charges for this.</p>","@type":"Answer"},"@type":"Question"},{"name":"Do I opt for mini-comprehensive or fully comprehensive?","acceptedAnswer":{"text":"<p>Fully comprehensive is recommended for new cars and offers maximum protection (see table with the different coverages). The mini-comprehensive option is attractive if your car is not so new but you still want extensive protection.</p>","@type":"Answer"},"@type":"Question"},{"name":"Do I have to pay an excess/deductible in the event of damage?","acceptedAnswer":{"text":"<p><span><span><span>An excess or deductible is the amount you have to pay yourself in the event of a claim.&nbsp;</span></span></span><span><span><span>You only have to pay a deductible in case you have an accident for which your full comprehensive cover intervenes. </span></span></span><span><span><span>With full comprehensive insurance, you can choose how much excess you want to pay when you sign up: 400 euros, 600 euros or 800 euros in the case of material damage to your own car caused by you.</span></span></span>&nbsp;<br /><strong>No excess is required&nbsp;if you take out mini-comprehensive car insurance.</strong> The same applies to glass breakage.</p>","@type":"Answer"},"@type":"Question"},{"name":"What must I do in the event of an accident?","acceptedAnswer":{"text":"<p>You should declare this damage as soon as possible:​</p><ol><li>Open your ING Banking-app or log on to Home'Bank​</li><li>Scroll down In the 'Insurances' section, select the relevant insurance​</li><li>Select 'Make a claim' at the top of the contract page ​</li></ol><p>Damaged window? Make an appointment with Carglass directly (if you have Mini-Omnium or Omnium, ING will cover the cost at no extra charge). &nbsp;​</p><p>For emergencies: Call the ING Assist'Line on&nbsp;<a href=\"tel:+32 2 725 15 00\">+32 2 725 15 00</a>, available 24/7.​</p>","@type":"Answer"},"@type":"Question"},{"name":"How does the simulator work?","acceptedAnswer":{"text":"<p>It calculates your prices based on the following assumptions:</p><ul><li>Car: options worth less than 1.500 EUR</li><li>Driver: had his license at 18, had no accident in the last 5 years, and drives less than 10.000 km/year</li><li>Coverage: a deductible of €600 EUR for Omnium</li></ul><p>It will give you an idea of how much your insurance would cost.</p><p>For a more personalised offer, you can always change these parameters in the next steps.</p>","@type":"Answer"},"@type":"Question"}],"@context":"https://schema.org","@type":"FAQPage"}</script>
